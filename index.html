  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Automating with Fastlane<\u002Ftitle>\n<script type=\"application/json\" id=\"speaker-notes\">\n[\n  \"Hey everyone. Today I want to walk through fastlane — it's a tool that takes all the tedious, manual work out of building and shipping our mobile apps. By the end you'll see how a release can go from a stressful, hour-long chore to something that basically happens on its own. We'll cover both iOS and Android, and I'll show you exactly how we'd roll it out.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Is this another tool to maintain?\\nA: It's the opposite — it replaces the scattered scripts and manual steps we already maintain with one thing that lives in the repo.\\n\\nQ: Does it lock us into a vendor?\\nA: No. It's free and open source, it wraps the same Xcode and Gradle tools we already use, and we can walk away anytime.\",\n  \"Let's start with why this matters. Right now, every time we ship, someone sits down and does it by hand. On iOS that means opening Xcode, picking the right settings, wrestling with signing, and babysitting an upload. On Android it's juggling signing keys and remembering the right commands. Add it all up and it's about 45 minutes of an engineer's time per release — before we've even run a test. And the worst part: it all lives in one person's head. If they're on vacation, we basically can't ship.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Where did the 45 minutes come from?\\nA: It's a rough average of a real release — archive, sign, upload, and the waiting in between. Even if your number is 25, it's still time we're throwing away every release.\\n\\nQ: Can't we just write a shell script?\\nA: We could, and people do, but you end up rebuilding what fastlane already gives us — signing, store uploads, retries — and then one person maintains that script forever.\",\n  \"So how does fastlane fix this? It's built on three simple ideas. Lanes are named shortcuts — you just type 'fastlane beta' and it runs. Actions are the ready-made steps inside a lane, like building the app or uploading it; there are over 400 of them. And plugins are community add-ons for anything extra we need. The key thing to remember is that all of this lives in our code repo. The way we build and ship becomes something we can review and version, just like the rest of our code.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Do we need to learn Ruby?\\nA: Barely. You copy steps from the docs and tweak values. If you can read the lane on the next slide, you can write one.\\n\\nQ: How stable are the community plugins?\\nA: We pin versions in the repo, so a plugin can't change under us. We only pull in well-maintained ones, and we can drop any of them without touching the core setup.\",\n  \"Here's what a lane actually looks like. Don't worry about the exact syntax — just read it top to bottom. Bump the build number, sign the app, build it, upload to TestFlight, post a message to Slack. That's the whole release, written out as a checklist a computer follows. We kick it off with one command. And the big win: it runs the exact same way on my laptop as it does on the build server. No more 'well, it works on my machine.'\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: What happens when a step fails?\\nA: The lane stops right there and tells us which step failed, so nothing half-ships.\\n\\nQ: Can we still build manually if we need to?\\nA: Absolutely. Xcode and Android Studio still work exactly as before — fastlane just automates the path we'd normally click through.\",\n  \"Now, the hardest part of all this — especially on iOS — is code signing. Apple's signing files live on each person's machine, they expire without warning, and they're genuinely painful to share. Five engineers end up with five different setups. A fresh build server starts with nothing, so it can't sign at all. And when you hit Apple's limits and delete a file, you break someone else's build. It's a constant, low-grade headache.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Isn't this just an Apple problem?\\nA: Mostly, yes — Android signing is far simpler. But iOS is where we lose the most time today, so it's where automation pays off fastest.\\n\\nQ: Why not just use Xcode's automatic signing?\\nA: It's fine for one developer, but it quietly creates new files per machine and can't run on a build server, which is exactly what breaks at our size.\",\n  \"This is where fastlane match comes in, and honestly it's the part that changes everything. Instead of everyone having their own signing files, we keep one shared set, encrypted, in a private Git repo. Everything's locked with a single password. Every engineer and every build server pulls down the exact same files. And setting up a brand-new machine takes one command and under a minute.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Is it safe to put signing files in Git?\\nA: Yes — they're encrypted before they ever touch the repo, the repo is private, and only people with the shared password can unlock them.\\n\\nQ: Where does the password live?\\nA: In our password manager for people, and in the CI's secret store for the build server — never in the code.\\n\\nQ: What if the password leaks?\\nA: We rotate it and re-encrypt with one command, same as any other secret.\",\n  \"The flow is simple. You run match. It downloads the locked signing files from the repo. It unlocks them with the shared password. And then it's ready — the build gets signed and shipped. One important setting: on the build server we tell it to only read those files, never change them. That way the repo always stays the single source of truth and nothing gets regenerated by accident.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: What about when a certificate actually expires?\\nA: One person runs match in write mode to renew it, commits the new files, and everyone else just picks them up automatically.\\n\\nQ: Do all our machines need that write access?\\nA: No — only the rare renewal does. Day to day, everyone and every build is read-only, which is what keeps things from breaking.\",\n  \"There are really just two files to know about. The Appfile says who we are and where we're shipping — our app IDs and accounts. The Fastfile says what to do — the actual lanes for iOS and Android. Both platforms sit right next to each other in one folder, so the whole thing reviews as a single change. As you can see, it's not much code.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Does every app need its own copy of these?\\nA: Each app has its own small Appfile and Fastfile, but they follow the same pattern, so a second app is mostly copy-paste.\\n\\nQ: Can we share common steps across apps?\\nA: Yes — shared logic can live in one place that every app pulls from, so we're not maintaining the same lane five times.\",\n  \"And this scales nicely across both platforms. iOS and Android each have their own steps under the hood, but we give them the same lane names, the same trigger, and the same Slack notification. So if you've learned how we ship iOS, you already understand Android. One way of thinking, two platforms.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Does this work with React Native or Flutter?\\nA: Yes — fastlane drives the native iOS and Android builds underneath, so cross-platform projects use the exact same lanes.\\n\\nQ: What about our CI provider?\\nA: It's CI-agnostic — GitHub Actions, Bitrise, CircleCI, Jenkins all just run the same one command we run locally.\",\n  \"Put it all together and here's the payoff. Someone merges to main. The build server automatically runs the lane, match signs the app, and it goes straight to TestFlight and Google Play. Nobody touches anything. It runs on every push, and every single run is logged, so we always know exactly what shipped and when.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: Does shipping on every merge mean every change goes to users?\\nA: No — this goes to testers, on TestFlight and Play's internal track. Promoting to real users stays a deliberate, separate step.\\n\\nQ: What if a bad build gets out to testers?\\nA: We just merge a fix and the next build ships automatically — and because every run is logged, we can see exactly what went out and roll forward fast.\",\n  \"So what do we actually get out of this? That 45 minutes per release drops to zero. Setting up a new machine goes from a half-day of frustration to under a minute. And shipping becomes a single command. But the real shift is cultural — releases stop being this scary event we plan around, and just become something that happens when we merge. My recommendation: start with match to fix signing, wrap our existing builds in lanes, move it onto CI, and get to shipping on every merge.\\n\\n— — —\\nLIKELY QUESTIONS\\n\\nQ: How long to set this up?\\nA: The first iOS app, with match and a basic lane, is realistically a few days. After that, each additional app is hours, not days.\\n\\nQ: What's the catch?\\nA: Honestly, the upfront learning curve on signing and CI config. But it's a one-time cost, and the team only has to climb it once.\\n\\nQ: Where should we start?\\nA: Pick one app, get match working to fix signing, then wrap the build we already do by hand into a lane. Everything else builds on that.\"\n]\n<\u002Fscript>\n<style>/* fallback */\n@font-face {\n  font-family: 'Material Symbols Rounded';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"982d8cb2-d9e6-4a7f-92aa-1dc0e53d0a23\") format('woff2');\n}\n\n.material-symbols-rounded {\n  font-family: 'Material Symbols Rounded';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n<style>\n  @ l signing headaches.<\u002Fp>\n      <div class=\"row anim d3\" style=\"gap:14px; margin-top:64px; flex-wrap:wrap;\">\n        <span class=\"chip\">Lanes &amp; Actions<\u002Fspan>\n        <span class=\"chip\">fastlane match<\u002Fspan>\n        <span class=\"chip\">TestFlight<\u002Fspan>\n        <span class=\"chip\">Google Play<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · THE MANUAL BUILD TAX -->\n  <section data-label=\"Manual Build Tax\">\n    <div class=\"slide\">\n      <div class=\"eyebrow anim\"><span>The Problem<\u002Fspan><span class=\"num\">/ 01<\u002Fspan><\u002Fdiv>\n      <h2 class=\"title anim d1\" style=\"margin-top:var(--gap-title); max-width:1300px;\">The manual build tax<\u002Fh2>\n      <p class=\"body anim d2\" style=\"margin-top:26px; max-width:1080px;\">Every release we do by hand eats up an engineer's time on work a computer should handle.<\u002Fp>\n\n      <div class=\"row grow anim d3\" style=\"gap:28px; margin-top:54px;\">\n        <div class=\"col\" style=\"flex:1; gap:22px;\">\n          <div class=\"col\" style=\"flex:1; justify-content:center; background:var(--grey-850); border:1px solid var(--line); border-radius:16px; padding:34px 36px; gap:14px;\">\n            <svg viewBox=\"0 0 24 24\" width=\"42\" height=\"42\" fill=\"var(--crimson-bright)\" style=\"display:block;\"><path d=\"M17.05 12.04c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.89-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.88 2.65 3.22 2.6 1.29-.05 1.78-.83 3.34-.83 1.55 0 2 .83 3.36.81 1.39-.03 2.27-1.27 3.12-2.53.98-1.45 1.39-2.85 1.41-2.92-.03-.01-2.71-1.04-2.74-4.13zM14.6 4.66c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.26.68-2.99 1.54-.66.76-1.23 1.98-1.08 3.15 1.14.09 2.3-.58 3.01-1.44z\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:27px; font-weight:600;\">iOS · Xcode Archive<\u002Fdiv>\n            <div class=\"body\" style=\"font-size:24px; line-height:1.45;\">Pick the right settings, fight with signing certificates, upload by hand, then babysit it for 20 minutes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"col\" style=\"flex:1; justify-content:center; background:var(--grey-850); border:1px solid var(--line); border-radius:16px; padding:34px 36px; gap:14px;\">\n            <svg viewBox=\"0 0 24 24\" width=\"42\" height=\"42\" fill=\"var(--crimson-bright)\" style=\"display:block;\"><path d=\"M6 18c0 .55.45 1 1 1h1v3.5a1.5 1.5 0 0 0 3 0V19h2v3.5a1.5 1.5 0 0 0 3 0V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8A1.5 1.5 0 0 0 2 9.5v7a1.5 1.5 0 0 0 3 0v-7A1.5 1.5 0 0 0 3.5 8zm17 0a1.5 1.5 0 0 0-1.5 1.5v7a1.5 1.5 0 0 0 3 0v-7A1.5 1.5 0 0 0 20.5 8zm-4.97-5.84l1.3-1.3a.5.5 0 0 0-.71-.71l-1.48 1.48A5.9 5.9 0 0 0 12 1c-.96 0-1.86.23-2.66.63L7.85.15a.5.5 0 1 0-.71.71l1.31 1.31A5.94 5.94 0 0 0 6 7h12c0-1.99-.97-3.75-2.47-4.84zM10 5H9V4h1v1zm5 0h-1V4h1v1z\"><\u002Fpath><\u002Fsvg>\n            <div style=\"font-size:27px; font-weight:600;\">Android · Gradle Assemble<\u002Fdiv>\n            <div class=\"body\" style=\"font-size:24px; line-height:1.45;\">Signing keys shared over Slack, build commands half-remembered, and uploads done by hand.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"col\" style=\"flex:1.05; background:linear-gradient(150deg,#1a1020,#161a24); border:1px solid var(--crimson-deep); border-radius:16px; padding:44px 46px; justify-content:center; gap:30px;\">\n          <div class=\"eyebrow\" style=\"margin:0;\"><span>What it actually costs<\u002Fspan><\u002Fdiv>\n          <div class=\"row\" style=\"gap:18px; align-items:baseline;\"><span style=\"font-size:88px; font-weight:800; color:var(--crimson-bright); letter-spacing:-.03em;\">45<span style=\"font-size:40px;\">min<\u002Fspan><\u002Fspan><span class=\"body\" style=\"font-size:25px;\">of engineer time per release, before a single test runs.<\u002Fspan><\u002Fdiv>\n          <div style=\"height:1px; background:var(--line);\"><\u002Fdiv>\n          <div class=\"body\" style=\"font-size:25px; line-height:1.5;\">It all lives in one person's head. <span class=\"accent\">If they're out, nobody ships<\u002Fspan> — and every new laptop breaks signing again.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · CORE ARCHITECTURE -->\n  <section data-label=\"Core Architecture\">\n    <div class=\"slide\">\n      <div class=\"eyebrow anim\"><span>How Fastlane Is Built<\u002Fspan><span class=\"num\">/ 02<\u002Fspan><\u002Fdiv>\n      <h2 class=\"title anim d1\" style=\"margin-top:var(--gap-title);\">Core architecture: lanes, actions, plugins<\u002Fh2>\n\n      <div class=\"row grow anim d2\" style=\"gap:28px; margin-top:56px;\">\n        <div class=\"col\" style=\"flex:1; background:var(--grey-850); border:1px solid var(--line); border-radius:18px; padding:42px 40px; gap:20px;\">\n          <div class=\"pill-num\">01<\u002Fdiv>\n          <div style=\"font-size:32px; font-weight:700;\">Lanes<\u002Fdiv>\n          <div class=\"body\" style=\"font-size:25px;\">Named shortcuts you run — like <span style=\"font-family:ui-monospace,'SF Mono','Menlo','Monaco',monospace; color:var(--code-str);\">fastlane beta<\u002Fspan>. This is the thing the team actually triggers.<\u002Fdiv>\n          <div class=\"grow\"><\u002Fdiv>\n          <code style=\"font-family:ui-monospace,'SF Mono','Menlo','Monaco',monospace; font-size:24px; color:var(--fg-dim);\">lane :beta do … end<\u002Fcode>\n        <\u002Fdiv>\n        <div class=\"col\" style=\"flex:1; background:var(--grey-850); border:1px solid var(--crimson-deep); border-radius:18px; padding:42px 40px; gap:20px;\">\n          <div class=\"pill-num\">02<\u002Fdiv>\n          <div style=\"font-size:32px; font-weight:700;\">Actions<\u002Fdiv>\n          <div class=\"body\" style=\"font-size:25px;\">400+ ready-made steps — build the app, sign it, upload it. These are the building blocks inside a lane.<\u002Fdiv>\n          <div class=\"grow\"><\u002Fdiv>\n          <code style=\"font-family:ui-monospace,'SF Mono','Menlo','Monaco',monospace; font-size:24px; color:var(--fg-dim);\">gym · scan · supply · pilot<\u002Fcode>\n        <\u002Fdiv>\n        <div class=\"col\" style=\"flex:1; background:var(--grey-850); border:1px solid var(--line); border-radius:18px; padding:42px 40px; gap:20px;\">\n          <div class=\"pill-num\">03<\u002Fdiv>\n          <div style=\"font-size:32px; font-weight:700;\">Plugins<\u002Fdiv>\n          <div class=\"body\" style=\"font-size:25px;\">Add-ons from the community for anything extra — Firebase, release notes, Slack. Added per project and saved with your code.<\u002Fdiv>\n          <div class=\"grow\"><\u002Fdiv>\n          <code style=\"font-family:ui-monospace,'SF Mono','Menlo','Monaco',monospace; font-size:24px; color:var(--fg-dim);\">fastlane add_plugin …<\u002Fcode>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"body anim d3\" style=\"margin-top:34px; font-size:25px;\">It all lives in your repo. <span class=\"fg\">The way you build and ship becomes code — reviewed and version-controlled like everything else.<\u002Fspan><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · ANATOMY OF A LANE -->\n  <section data-label=\"Anatomy of a Lane\">\n    <div class=\"slide\">\n      <div class=\"eyebrow anim\"><span>The Unit of Automation<\u002Fspan><span class=\"num\">/ 03<\u002Fspan><\u002Fdiv>\n      <h2 class=\"title anim d1\" style=\"margin-top:var(--gap-title);\">Anatomy of a lane<\u002Fh2>\n\n      <div class=\"row grow anim d2\" style=\"gap:44px; margin-top:48px; align-items:stretch;\">\n        <div class=\"code anim d2\" style=\"flex:1.3;\">\n          <div class=\"code-bar\">\n            <span class=\"dot\" style=\"background:#ff5f56;\"><\u002Fspan><span class=\"dot\" style=\"background:#ffbd2e;\"><\u002Fspan><span class=\"dot\" style=\"background:#27c93f;\"><\u002Fspan>\n            <span class=\"code-file\">fastlane/ f signing files for the whole team, locked away safely <span class=\"fg\">in a Git repo<\u002Fspan> — not on anyone's laptop.<\u002Fp>\n          <div class=\"col anim d3\" style=\"gap:20px; margin-top:46px;\">\n            <div class=\"row\" style=\"gap:18px; align-items:flex-start;\"><span class=\"material-symbols-rounded\" style=\"color:var(--crimson-bright); font-size:34px;\">lock<\u002Fspan><span class=\"body\" style=\"font-size:26px;\">All signing files encrypted with one shared password.<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"gap:18px; align-items:flex-start;\"><span class=\"material-symbols-rounded\" style=\"color:var(--crimson-bright); font-size:34px;\">groups<\u002Fspan><span class=\"body\" style=\"font-size:26px;\">Everyone — and every build server — uses the <em>same<\u002Fem> files.<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"gap:18px; align-items:flex-start;\"><span class=\"material-symbols-rounded\" style=\"color:var(--crimson-bright); font-size:34px;\">bolt<\u002Fspan><span class=\"body\" style=\"font-size:26px;\">Set up a new machine with one command, in under a minute.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"code anim d3\" style=\"flex:.95;\">\n          <div class=\"code-bar\">\n            <span class=\"dot\" style=\"background:#ff5f56;\"><\u002Fspan><span class=\"dot\" style=\"background:#ffbd2e;\"><\u002Fspan><span class=\"dot\" style=\"background:#27c93f;\"><\u002Fspan>\n            <span class=\"code-file\">fastlane/Matchfile<\u002Fspan>\n          <\u002Fdiv>\n          <pre class=\"src sm\"><span class=\"c\"># Encrypted signing repo<\u002Fspan>\ngit_url(<span class=\"s\">\"git@github.com:acme/certs.git\"<\u002Fspan>)\nstorage_mode(<span class=\"s\">\"git\"<\u002Fspan>)\n\ntype(<span class=\"s\">\"appstore\"<\u002Fspan>)\napp_identifier([<span class=\"s\">\"com.acme.app\"<\u002Fspan>])\nusername(<span class=\"s\">\"ci@acme.com\"<\u002Fspan>)\n\n<span
